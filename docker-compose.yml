services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: eventshop-rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
  payment-postgres:
    image: postgres:16
    container_name: eventshop-payment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eventshop_payment
    ports:
      - "5433:5432"
    volumes:
      - payment_postgres_data:/var/lib/postgresql/data
  inventory-postgres: 
    image: postgres:16 
    container_name: eventshop-inventory-postgres 
    restart: unless-stopped 
    environment: 
      POSTGRES_USER: postgres 
      POSTGRES_PASSWORD: postgres 
      POSTGRES_DB: eventshop_inventory 
    ports: 
      - '5434:5432' 
    volumes: 
      - inventory_postgres_data:/var/lib/postgresql/data


volumes:
  rabbitmq_data:
  payment_postgres_data:
  inventory_postgres_data: